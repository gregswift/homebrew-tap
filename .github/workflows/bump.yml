name: bump

on:
  # Wednesdays. GitHub runs cron in UTC and does not follow daylight saving, so
  # this is 10:00 or 09:00 Central depending on the time of year.
  schedule:
    - cron: "0 15 * * 3"
  workflow_dispatch:

# The only thing written is this repository, which is why no secret is needed:
# the source repositories are public, so reading their releases needs nothing.
permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/bump-formula.sh Formula/git-refresh.rb gregswift/git-refresh

      - name: Commit the bump
        if: steps.bump.outputs.tag != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula
          git commit -m "git-refresh ${{ steps.bump.outputs.tag }}"
          git push
